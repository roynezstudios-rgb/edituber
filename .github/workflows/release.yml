name: Release candidate archive

on:
  push:
    tags: ["v*-rc.*", "v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check && pnpm test && pnpm build
      - name: Build source archive
        run: |
          git archive --format=zip --prefix=edituber/ -o edituber-source.zip HEAD
          sha256sum edituber-source.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" edituber-source.zip SHA256SUMS.txt --generate-notes $PRERELEASE
